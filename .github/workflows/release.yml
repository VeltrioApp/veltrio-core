name: Release

# Pushing a tag vX.Y.Z builds every platform's artifact and publishes them
# on the GitHub release of that tag. The apps pin a tag in core.version and
# download from it.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release to create (vX.Y.Z); empty = build only, no release
        type: string
        default: ""
      apple:
        description: Build macOS + iOS
        type: boolean
        default: true
      tvos:
        description: Also build tvOS (nightly toolchain)
        type: boolean
        default: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  apple:
    name: macOS + iOS
    if: github.event_name == 'push' || inputs.apple
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin,aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - uses: Swatinem/rust-cache@v2
      - run: ./scripts/package-macos.sh
      - run: ./scripts/package-ios.sh
      - uses: actions/upload-artifact@v4
        with:
          name: apple
          path: |
            dist/veltrio-core-macos.zip
            dist/veltrio-core-apple-mobile.zip

  tvos:
    name: tvOS (nightly)
    # tvOS is a tier-3 Rust target. Kept separate with continue-on-error so a
    # nightly regression can't block a release; the tvOS app pins a release that has it.
    if: github.event_name == 'push' || inputs.tvos || vars.BUILD_TVOS == 'true'
    runs-on: macos-15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - uses: Swatinem/rust-cache@v2
      - run: VELTRIO_TVOS=1 ./scripts/package-ios.sh
      - run: mv dist/veltrio-core-apple-mobile.zip dist/veltrio-core-apple-mobile-tvos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: tvos
          path: dist/veltrio-core-apple-mobile-tvos.zip

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-ndk --locked
      - run: ./scripts/package-android.sh
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/veltrio-core-android.zip

  windows:
    name: Windows
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: uniffi-bindgen-cs (C# bindings)
        run: cargo install uniffi-bindgen-cs --git https://github.com/NordSecurity/uniffi-bindgen-cs --tag "v0.10.0+v0.29.4" --locked
      - run: ./scripts/package-windows.sh
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/veltrio-core-windows-x64.zip

  publish:
    name: Publish release
    needs: [apple, android, windows, tvos]
    # tvOS may fail (continue-on-error) and Apple may be skipped on a manual
    # run; everything that ran must have succeeded.
    if: >-
      always()
      && (needs.apple.result == 'success' || needs.apple.result == 'skipped')
      && needs.android.result == 'success' && needs.windows.result == 'success'
      && (startsWith(github.ref, 'refs/tags/') || inputs.tag != '')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          # The pushed tag, or the one given to a manual run (created on
          # the run's commit if it doesn't exist yet).
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" artifacts/*.zip --target "$GITHUB_SHA" \
            --repo "$GITHUB_REPOSITORY" --title "veltrio-core $TAG" --generate-notes
