[workspace]
resolver = "2"
members = ["veltrio-core"]

[workspace.package]
version = "0.1.3"
edition = "2021"
authors = ["Veltrio contributors"]
license = "MIT OR Apache-2.0"
rust-version = "1.80"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "webpki-roots", "gzip", "brotli", "charset", "form"] }
librqbit = { version = "9.1", default-features = false, features = ["rust-tls", "http-api", "tracing-subscriber-utils"] }
librqbit-dualstack-sockets = "0.7"
axum = "0.8"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = { version = "2", features = ["serde"] }
once_cell = "1"
parking_lot = "0.12"
uniffi = { version = "0.29", features = ["cli", "tokio"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# librqbit-dualstack-sockets 0.7.0 only knows macOS among Apple systems
# and fails to build for iOS/tvOS. See patches/README.md.
[patch.crates-io]
librqbit-dualstack-sockets = { path = "patches/librqbit-dualstack-sockets" }
